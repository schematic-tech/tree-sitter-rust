name: Validate Schematic parser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Test Rust binding and documentation
        run: cargo test --locked
      - name: Verify packaged crate
        run: cargo package --locked
      - name: Test grammar corpus
        run: npx --yes tree-sitter-cli@0.26.7 test
